<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Today — Reading Companion</title>
<style>
:root{--paper:#fffbe8;--paper-deep:#eee3c8;--ink:#28251f;--muted:#81786a;--orange:#eb5c33;--blue:#166be0;--yellow:#f7b017;--white:#fffdf6;--shadow:0 12px 34px #45351a12}
*{box-sizing:border-box}body{margin:0;padding:18px;background:transparent;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:520px;margin:auto}.card{position:relative;overflow:hidden;background:var(--paper);border:1px solid #e9ddbf;border-radius:22px;padding:21px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.wordmark{font-family:Georgia,serif;font-size:32px;letter-spacing:-1.5px;font-weight:700}.date{font-size:11px;font-weight:750;letter-spacing:.5px;text-transform:lowercase;color:var(--orange);text-align:right}
.pages{display:flex;gap:10px;align-items:flex-start;margin-top:19px}.book-icon{font-size:20px;color:var(--orange);line-height:1.2}.pages-main{font-size:14px;font-weight:750}.quip{font-size:12px;color:var(--orange);font-style:italic;margin-top:3px}.edit-pages{margin-left:auto;display:flex;align-items:center;gap:5px}.edit-pages input{width:70px;border:1px solid var(--paper-deep);background:#fffdf8;border-radius:9px;padding:7px;font:inherit;font-size:12px;color:var(--ink)}
.rule{height:1px;background:var(--paper-deep);margin:17px 0}.vibe{font:italic 19px/1.4 Georgia,serif}.eyebrow{font-size:9px;font-weight:850;letter-spacing:1.2px;color:#81786a;margin-bottom:7px}.definition{font-size:13px;line-height:1.5}.definition strong{color:var(--orange)}.duo{display:grid;grid-template-columns:1fr 1fr;gap:17px}.mini-label{font-size:9px;letter-spacing:1px;font-weight:850;color:var(--orange);margin-bottom:5px}.mini-label.dont{color:#81786a}.mini-copy{font-size:12px;line-height:1.45}.basics{display:grid;gap:10px}.basic{display:flex;gap:9px;align-items:center;font-size:13px;cursor:pointer;line-height:1.35}.basic input{appearance:none;width:17px;height:17px;flex:0 0 17px;border:1.5px solid #cfc3a8;border-radius:50%;margin:0;display:grid;place-items:center;background:transparent}.basic input:checked{border-color:var(--orange);background:var(--orange)}.basic input:checked:after{content:'✓';color:white;font-size:11px;font-weight:900}.basic:has(input:checked) span{color:#9b9284;text-decoration:line-through;text-decoration-color:#c9bba3}.done{font-size:12px;font-weight:800;color:var(--orange);margin-top:12px;line-height:1.4}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.progress{font-size:10px;color:var(--muted)}button{font:inherit;cursor:pointer}.toggle{border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:750;padding:9px 13px}.reset{border:0;background:transparent;color:var(--muted);font-size:10px;text-decoration:underline;padding:5px}.compact .card{padding:16px}.compact .wordmark{font-size:27px}.compact .vibe,.compact .definition,.compact .duo{display:none}.compact .rule{margin:13px 0}.compact .basic{font-size:11px}.compact .basics{gap:7px}.compact .pages{margin-top:12px}.compact .pages .edit-pages{display:none}.confetti{pointer-events:none;position:absolute;inset:0;overflow:hidden}.confetti i{position:absolute;width:7px;height:12px;background:var(--orange);top:-20px;animation:fall 1.8s ease-in forwards}.confetti i:nth-child(3n){background:var(--blue)}.confetti i:nth-child(3n+1){background:var(--yellow)}@keyframes fall{to{transform:translateY(600px) rotate(650deg);opacity:0}}.note{font-size:10px;color:var(--muted);text-align:center;margin:12px 5px 0;line-height:1.5}.view-switch{display:flex;justify-content:flex-end;margin-bottom:8px}.view-switch button{background:transparent;border:1px solid var(--paper-deep);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:10px}
@media(max-width:360px){body{padding:8px}.card{padding:16px}.duo{gap:12px}.wordmark{font-size:28px}.vibe{font-size:17px}}
</style></head>
<body><div class="wrap" id="app">
<div class="view-switch"><button id="viewBtn" type="button">Switch to compact tile ↗</button></div>
<main class="card" id="card">
<div class="top"><div class="wordmark">today</div><div class="date" id="dateLine"></div></div>
<div class="pages"><div class="book-icon">▤</div><div><div class="pages-main"><span id="pagesNum">0</span> pages today</div><div class="quip" id="quip">no pages yet — the spice awaits</div></div><div class="edit-pages"><label for="pagesInput" style="font-size:10px;color:var(--muted)">Set</label><input id="pagesInput" type="number" min="0" max="9999" value="0" aria-label="Pages read today"></div></div>
<div class="rule"></div><div class="vibe" id="vibe"></div>
<div class="rule"></div><section><div class="eyebrow">BOOKTOK WORD OF THE DAY</div><div class="definition" id="definition"></div></section>
<div class="rule"></div><div class="duo"><section><div class="mini-label">DO</div><div class="mini-copy" id="doLine"></div></section><section><div class="mini-label dont">DON'T</div><div class="mini-copy" id="dontLine"></div></section></div>
<div class="rule"></div><section><div class="eyebrow">THE BASICS</div><div class="basics" id="basics"></div><div class="done" id="doneMessage" hidden></div></section>
<div class="footer"><div class="progress" id="progress">0 of 4 basics done</div><button class="reset" id="resetBtn" type="button">Reset today</button></div><div class="confetti" id="confetti"></div>
</main><div class="note">Your checkboxes and page count are saved in this browser on this device. They reset for a new date. This standalone version does not automatically read your Notion database.</div>
</div>
<script>
const vibes=[
"One more chapter is a lie you tell yourself. Tell it anyway.","You contain multitudes. Most of them are fictional men.","Your standards aren't too high. They're book-shaped. That's allowed.","Romanticise your own life today. You've read enough to know how.","A morally grey man is not a personality. But he is a great Tuesday.","Protect your peace. And your TBR. Mostly your TBR.","You are the main character. Act accordingly. (Responsibly.)","Reading smut is self-care with better pacing.","The ache is the point. You knew that going in.","Today's forecast: emotionally devastated by page 280.","You don't have commitment issues. You have a series to finish.","Closure is a myth invented by people who skip the epilogue.","Let yourself want things. Fictional things count.","The TBR is not a to-do list. It's a personality.","Touch grass. Then come back inside. He'll wait. So will the grass.","Hydrate. The spicy chapters won't survive a dehydrated woman.","Some days you're the sunshine. Some days you're the grumpy one. Valid.","Your worth is not a page count. (But the streak is nice.)","Make it a soft day: tea, blanket, emotional damage.","The book chose you. Don't make it wait."
];
const words=[
["Slow Burn","emotional damage, paid in instalments."],["Found Family","the only functional one in the book."],["Grumpy × Sunshine","him: weather warning. her: serotonin."],["Spice","the plot, allegedly."],["Enemies to Lovers","communication issues with excellent lighting."],["TBR","a monument to your optimism."],["Book Hangover","grief, but make it fictional."],["Morally Grey","not a red flag, a colour story."],["Fated Mates","the universe doing your situationship's job for it."],["Only One Bed","the inn's entire marketing strategy."],["Forced Proximity","the floor plan did this."],["He Falls First","and he falls hard. as is right and good."],["Smut","self-care with a storyline."],["Cliffhanger","the author's restraining order on your peace."],["DNF","the bravest thing a girl can do."],["Pining","wanting, professionally."],["Banter","foreplay with words."],["Epilogue","proof the universe can be kind."],["Book Boyfriend","the bar. the whole bar."],["Yearning","pining's more poetic cousin."]
];
const dos=["Reread the chapter you think about at 2am.","Annotate shamelessly.","Text the group chat your unhinged theory.","Choose the book over the doomscroll.","Make the tea, light the candle, commit.","Recommend it to one person today.","Give yourself a reading hour. Guard it.","Reread the spicy bit. For research.","Romanticise your commute. Bring the book.","Make a playlist for the book. Yes, really.","Start the comfort reread. No notes.","Let yourself stop at the good part. (Or don't.)"];
const donts=["Start a sixth book today.","Read the spoilers. You always regret it.","Compare your reading pace to anyone's.","Read the one-star review before bed.","Trust a man who doesn't grovel.","Skip the epilogue. That's where the serotonin lives.","Forget to eat because of a cliffhanger. Snack first.","Finish a book you actively resent. Let it go.","Let a slump shame you. Reread something cosy.","Feel bad about the spice. It's literature."];
const basics=["💧 Water (between chapters)","🍴 A real meal, not snacks","☀️ Outside for 10 minutes","💤 Sleep > one more chapter"];
const doneLines=["you did the basics. main character behaviour.","hydrated, fed, and unbothered. iconic.","self-soothed and well-read. the dream.","basics: done. now go be feral (responsibly).","look at you, thriving. go read your little book.","adult tasks: complete. reward: a chapter (or six)."];
const today=new Date(); const dateKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`; const daySeed=Math.floor(new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime()/86400000); const storageKey='todayCard.v1.'+dateKey;
let state={pages:0,checked:[false,false,false,false]}; try{state={...state,...JSON.parse(localStorage.getItem(storageKey)||'{}')}}catch(e){}
const $=id=>document.getElementById(id); const pick=(arr,offset=0)=>arr[((daySeed+offset)%arr.length+arr.length)%arr.length];
$('dateLine').textContent=today.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}).toLowerCase();
$('vibe').textContent=pick(vibes); const w=pick(words,7); $('definition').innerHTML='<strong></strong> — '; $('definition').firstChild.textContent=w[0]; $('definition').append(document.createTextNode(w[1])); $('doLine').textContent=pick(dos,3); $('dontLine').textContent=pick(donts,11);
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch(e){}}
function updatePages(){state.pages=Math.max(0,Number($('pagesInput').value)||0);$('pagesNum').textContent=state.pages;let q=state.pages===0?'no pages yet — the spice awaits':state.pages<=25?'just getting cosy':state.pages<=75?'officially invested':state.pages<=150?'one more chapter… sure':state.pages<=300?'who needs sleep anyway':'absolute menace. touch grass (later)';$('quip').textContent=q;save()}
function celebrate(){const box=$('confetti');box.innerHTML='';for(let i=0;i<46;i++){const bit=document.createElement('i');bit.style.left=(Math.random()*100)+'%';bit.style.animationDelay=(Math.random()*.45)+'s';bit.style.transform=`rotate(${Math.random()*360}deg)`;box.append(bit)}setTimeout(()=>box.innerHTML='',2300)}
function renderBasics(){const host=$('basics');host.innerHTML='';state.checked=basics.map((_,i)=>!!state.checked[i]);basics.forEach((label,i)=>{const lab=document.createElement('label');lab.className='basic';const input=document.createElement('input');input.type='checkbox';input.checked=state.checked[i];input.addEventListener('change',()=>{const was=state.checked.every(Boolean);state.checked[i]=input.checked;save();renderBasics();if(!was&&state.checked.every(Boolean))celebrate()});const span=document.createElement('span');span.textContent=label;lab.append(input,span);host.append(lab)});const n=state.checked.filter(Boolean).length;$('progress').textContent=`${n} of ${basics.length} basics done`;$('doneMessage').hidden=n!==basics.length;$('doneMessage').textContent=pick(doneLines,daySeed%doneLines.length)}
$('pagesInput').value=state.pages||0;$('pagesInput').addEventListener('change',updatePages);$('pagesInput').addEventListener('input',updatePages);$('resetBtn').addEventListener('click',()=>{if(confirm('Reset your page count and basics for today?')){state={pages:0,checked:[false,false,false,false]};$('pagesInput').value=0;updatePages();renderBasics()}});$('viewBtn').addEventListener('click',()=>{const compact=$('app').classList.toggle('compact');$('viewBtn').textContent=compact?'Switch to full card ↙':'Switch to compact tile ↗'});updatePages();renderBasics();
</script></body></html>
